name: Check packages
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      allow-local-version:
        default: false
        type: boolean

jobs:
  check_packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup mise
        uses: blampe/mise-action@blampe/plugins
        env:
          MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 30s
        with:
          version: 2025.11.6
          working_directory: ${{ runner.temp }}
          install_args: node@24.18.0 python@3.11.8 github:pulumi/pulumictl@0.0.50
          env: false
          cache_save: false
      - name: Download SDKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '{nodejs,python}-sdk.tar.gz'
          merge-multiple: true
          path: ${{ runner.temp }}/sdk
      - name: Check release packages
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          PROVIDER_VERSION: ${{ inputs.version }}
          ALLOW_LOCAL_VERSION: ${{ inputs.allow-local-version }}
        run: |
          flags=()
          if [[ "$ALLOW_LOCAL_VERSION" == true ]]; then
            flags+=(--allow-local-version)
          fi
          mkdir -p reports
          mise exec node@24.18.0 python@3.11.8 github:pulumi/pulumictl@0.0.50 -- \
            python3 "$GITHUB_WORKSPACE/scripts/check_packages.py" "${flags[@]}" \
            "$PROVIDER_VERSION" sdk/nodejs.tar.gz sdk/python.tar.gz 2>&1 | tee reports/packages.txt
      - name: Upload package checks
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: package-checks
          path: ${{ runner.temp }}/reports/
