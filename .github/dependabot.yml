# See GitHub's documentation for more information on this file:
# https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/configuration-options-for-dependency-updates
version: 2
updates:
  # Maintain the provider Go module. The root and tools directories have no
  # go.mod, so the earlier entries never produced updates. The shim, SDK, and
  # bridge versions are owned by the Upgrade Provider and Upgrade Bridge
  # workflows, so Dependabot does not manage the generated modules.
  - package-ecosystem: "gomod"
    directory: "/provider"
    schedule:
      # Check for updates to Go modules every weekday
      interval: "daily"
    groups:
      # Group all terraform-plugin-(go|sdk|framework|testing) dependencies together
      "terraform-plugin":
        patterns:
          - "github.com/hashicorp/terraform-plugin-*"
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      "github-actions":
        patterns:
          - "*" # Group all GitHub Actions dependencies together
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
